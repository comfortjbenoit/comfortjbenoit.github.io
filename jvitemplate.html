<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Sheet Generator</title>
<style>
  :root{
    --paper:#F4F5EE; --bar:#D3E2C9; --ink:#1B2118; --muted:#68775F;
    --rule:#9FB295; --rule-soft:#C4D2BB; --pen:#16418C; --stamp:#B0342B;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "Lucida Console", "DejaVu Sans Mono", monospace;
    --sans: "Arial Narrow", "Segoe UI", Tahoma, Arial, sans-serif;
    --rowmin:15px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:#8E9A86;
    background-image:radial-gradient(circle at 50% 0%, #A3AF9A 0%, #7E8A77 100%);
    color:var(--ink);font-family:var(--sans);font-size:14px;
    padding:8px;-webkit-font-smoothing:antialiased;
  }
  .sheet{
    max-width:1080px;margin:0 auto;background:var(--paper);
    border:1px solid #6E7C67;box-shadow:0 10px 30px rgba(20,28,18,.30);
    height:calc(100vh - 16px);height:calc(100dvh - 16px);
    display:flex;flex-direction:column;overflow:hidden;
  }

  /* ---- masthead + controls on one compact band ---- */
  .top{display:flex;align-items:center;gap:12px;flex-wrap:nowrap;
    padding:5px 12px;border-bottom:2px solid var(--ink);
    background:linear-gradient(#EDEFE5,#E4E8DB);flex:none}
  h1{font-size:17px;line-height:1;margin:0;font-weight:700;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
  .req{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--stamp)}
  .grp{display:flex;align-items:center;gap:6px}
  .grp label{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .spacer{flex:1 1 auto}

  select,input[type=date]{font-family:var(--mono);font-size:12px;color:var(--ink);
    background:#fff;border:1px solid var(--rule);padding:3px 5px;height:26px}
  select{max-width:118px}
  input[type=date].need{border-color:var(--stamp);background:#FFF4F3;box-shadow:inset 0 0 0 1px var(--stamp)}

  button{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
    background:#fff;color:var(--ink);border:1px solid var(--ink);padding:5px 8px;cursor:pointer;
    height:26px;white-space:nowrap;transition:background .12s,color .12s}
  button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
  button.danger{border-color:var(--stamp);color:var(--stamp)}
  button.danger:hover:not(:disabled){background:var(--stamp);color:#fff}
  button.key{border-color:var(--pen);color:var(--pen)}
  button.key:hover:not(:disabled){background:var(--pen);color:#fff}
  button:disabled{opacity:.4;cursor:not-allowed}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--stamp);outline-offset:1px}

  /* ---- body: grid on the left, notes on the right ---- */
  .body{flex:1 1 auto;display:flex;min-height:0}
  .gridcol{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0}
  .notecol{flex:0 0 420px;display:flex;flex-direction:column;min-height:0;
    border-left:2px solid var(--ink);background:var(--paper)}

  .hdr,.row{display:grid;grid-template-columns:32px 58px 82px minmax(0,1fr);align-items:stretch}
  .hdr{flex:none;border-bottom:2px solid var(--ink);background:var(--paper)}
  .hdr span{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;
    padding:3px 6px;color:var(--ink)}
  .hdr span:first-child{text-align:right}
  .rows{flex:1 1 auto;display:grid;grid-auto-rows:minmax(var(--rowmin),1fr);min-height:0;overflow:auto}
  .row:nth-child(odd){background:var(--bar)}
  .row:nth-child(even){background:var(--paper)}
  .row{border-bottom:1px solid rgba(159,178,149,.5)}
  .ln{display:flex;align-items:center;justify-content:flex-end;padding-right:6px;
    font-family:var(--mono);font-size:10px;color:var(--muted);user-select:none}
  .cell{width:100%;height:100%;border:0;background:transparent;padding:0 6px;
    font-family:var(--mono);font-size:12px;color:var(--pen);caret-color:var(--stamp);min-width:0}
  .cell::placeholder{color:rgba(104,119,95,.5)}
  .cell:focus{outline:0;background:#fff;box-shadow:inset 0 -2px 0 var(--stamp)}

  .notehd{flex:none;padding:4px 10px;border-bottom:2px solid var(--ink);background:var(--paper)}
  .notehd b{font-family:var(--sans);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  .notehd span{display:block;font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:2px}
  textarea{flex:1 1 auto;width:100%;min-height:0;resize:none;border:0;
    font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--pen);
    background:var(--bar);padding:8px 10px}
  textarea:focus{outline:0;background:#fff}

  /* ---- footer ---- */
  .foot{flex:none;display:flex;flex-wrap:nowrap;gap:10px;align-items:center;
    padding:5px 12px;border-top:2px solid var(--ink);background:linear-gradient(#EDEFE5,#E4E8DB)}
  .build{background:var(--pen);color:#fff;border-color:var(--pen);font-size:11px;padding:6px 14px;height:30px;letter-spacing:.11em;flex:none}
  .build:hover:not(:disabled){background:#0E2F69;border-color:#0E2F69;color:#fff}
  .build:disabled{background:#9AA394;border-color:#9AA394;color:#EDEFE5;opacity:1}
  .outname{font-family:var(--mono);font-size:11.5px;line-height:1.25;flex:none;white-space:nowrap}
  .outname small{display:block;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .outname span.warn{color:var(--stamp)}
  .count{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
  .count b{color:var(--ink)}

  .sheet[hidden]{display:none}
  #gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    background:#8E9A86;background-image:radial-gradient(circle at 50% 0%, #A3AF9A 0%, #7E8A77 100%)}
  #gate[hidden]{display:none}
  #gate .card{background:var(--paper);border:1px solid #6E7C67;
    box-shadow:0 14px 40px rgba(20,28,18,.34);padding:22px 26px 24px;width:min(330px,92vw);text-align:center}
  #gate .lockstamp{display:inline-block;transform:rotate(-5deg);border:2px solid var(--stamp);
    outline:1px solid var(--stamp);outline-offset:2px;color:var(--stamp);padding:5px 11px;
    font-family:var(--mono);font-size:9px;letter-spacing:.16em;line-height:1.4;text-transform:uppercase;
    opacity:.9;margin-bottom:16px}
  #gate .lockstamp b{display:block;font-size:13px;letter-spacing:.07em}
  #gate h2{margin:0 0 3px;font-size:16px;text-transform:uppercase;letter-spacing:.04em}
  #gate p{margin:0 0 14px;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.05em}
  #pw{width:100%;height:36px;text-align:center;font-family:var(--mono);font-size:17px;
    letter-spacing:.38em;text-indent:.38em;color:var(--pen);background:#fff;
    border:1px solid var(--rule);padding:4px}
  #pw:focus{outline:0;border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}
  #gate .go{width:100%;margin-top:10px;height:32px;background:var(--pen);color:#fff;
    border-color:var(--pen);font-size:11px;letter-spacing:.14em}
  #gate .go:hover{background:#0E2F69;border-color:#0E2F69;color:#fff}
  #gateMsg{min-height:15px;margin-top:9px;font-family:var(--mono);font-size:10px;
    letter-spacing:.05em;color:var(--stamp)}
  .shake{animation:shk .3s}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @media (prefers-reduced-motion:reduce){.shake{animation:none}}

  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(12px);
    background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:12px;padding:9px 15px;
    opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:90vw;z-index:50}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.bad{background:var(--stamp)}

  @media (max-width:980px){
    .top,.foot{flex-wrap:wrap}
  }
  @media (max-width:900px){
    .sheet{height:auto;min-height:calc(100vh - 16px);min-height:calc(100dvh - 16px)}
    .body{flex-direction:column}
    .notecol{flex:0 0 auto;border-left:0;border-top:2px solid var(--ink)}
    textarea{min-height:120px}
    .rows{grid-auto-rows:minmax(24px,auto)}
  }
  @media (max-height:660px){
    :root{--rowmin:14px}
    .cell{font-size:11px} .ln{font-size:9px}
    h1{font-size:15px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="gate">
  <div class="card" id="gateCard">
    <div class="lockstamp">Locked<b>018</b></div>
    <h2>Inventory Generator</h2>
    <p>Enter the code to continue</p>
    <input type="password" id="pw" inputmode="numeric" autocomplete="off"
           autocorrect="off" spellcheck="false" aria-label="Password">
    <button class="go" id="btnUnlock" type="button">Unlock</button>
    <div id="gateMsg" role="status" aria-live="polite"></div>
  </div>
</div>

<div class="sheet" hidden>

  <div class="top">
    <h1>Inventory Sheet Generator</h1>
    <div class="grp">
      <label for="dueDate">Date C4</label>
      <input type="date" id="dueDate" required>
      <span class="req" id="dateReq">required</span>
    </div>
    <div class="grp"><button id="btnOpen" class="key" type="button">Open .xls</button></div>
    <div class="spacer"></div>
    <div class="grp"><button id="btnClear" class="danger" type="button">Clear</button></div>
  </div>

  <div class="body">
    <div class="gridcol">
      <div class="hdr"><span>Row</span><span>Pack</span><span>Size</span><span>Description</span></div>
      <div class="rows" id="grid"></div>
    </div>
    <div class="notecol">
      <div class="notehd"><b>Joe's Notes</b><span>overlay on F15:G37 — cells stay empty</span></div>
      <textarea id="noteText" placeholder="Leave blank for no note."></textarea>
    </div>
  </div>

  <div class="foot">
    <button class="build" id="btnBuild" type="button" disabled>Build the .xls</button>
    <div class="outname"><small>Saves as</small><span id="outName" class="warn">set a date first</span></div>
    <div class="grp">
      <label for="presetSel">List</label>
      <select id="presetSel"><option value="">— none —</option></select>
      <button id="btnLoad" type="button">Load</button>
      <button id="btnSave" type="button">Save as…</button>
      <button id="btnDel" class="danger" type="button">Delete</button>
      <button id="btnRestore" type="button" hidden>Restore</button>
    </div>
    <div class="count" id="count"></div>
  </div>
</div>

<input type="file" id="xlsFile" accept=".xls" hidden>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* xlslib.js - minimal CFB (OLE2) reader/writer + BIFF8 cell injector.
   No dependencies. Works in browser and Node.
   Purpose: rewrite specific cells in an existing .xls while preserving
   EVERYTHING else byte-for-byte, including a _VBA_PROJECT_CUR macro storage. */
(function (root) {
'use strict';

var ENDOFCHAIN = 0xFFFFFFFE, FREESECT = 0xFFFFFFFF, FATSECT = 0xFFFFFFFD, DIFSECT = 0xFFFFFFFC;

/* ---------------- CFB READ ---------------- */
function cfbRead(u8) {
  var dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  var sig = [];
  for (var i = 0; i < 8; i++) sig.push(u8[i]);
  var expect = [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1];
  for (i = 0; i < 8; i++) if (sig[i] !== expect[i]) throw new Error('Not an OLE2/.xls file (bad signature).');

  var ssz = 1 << dv.getUint16(30, true);
  var mssz = 1 << dv.getUint16(32, true);
  var nFat = dv.getUint32(44, true);
  var dirStart = dv.getUint32(48, true);
  var miniCutoff = dv.getUint32(56, true);
  var miniFatStart = dv.getUint32(60, true);
  var nMiniFat = dv.getUint32(64, true);
  var difStart = dv.getUint32(68, true);
  var nDif = dv.getUint32(72, true);

  function sectorOffset(s) { return (s + 1) * ssz; }

  // DIFAT
  var difat = [];
  for (i = 0; i < 109; i++) {
    var v = dv.getUint32(76 + i * 4, true);
    if (v === FREESECT || v === ENDOFCHAIN) break;
    difat.push(v);
  }
  var ds = difStart, guard = 0;
  while (ds !== ENDOFCHAIN && ds !== FREESECT && guard++ < 1000000 && nDif > 0) {
    var base = sectorOffset(ds);
    for (i = 0; i < (ssz / 4) - 1; i++) {
      var vv = dv.getUint32(base + i * 4, true);
      if (vv !== FREESECT && vv !== ENDOFCHAIN) difat.push(vv);
    }
    ds = dv.getUint32(base + ssz - 4, true);
  }

  // FAT
  var fat = new Uint32Array(difat.length * (ssz / 4));
  var k = 0;
  for (i = 0; i < difat.length; i++) {
    var off = sectorOffset(difat[i]);
    for (var j = 0; j < ssz / 4; j++) fat[k++] = dv.getUint32(off + j * 4, true);
  }

  function chain(start) {
    var out = [], s = start, g = 0;
    while (s !== ENDOFCHAIN && s !== FREESECT && s < fat.length && g++ < 1000000) { out.push(s); s = fat[s]; }
    return out;
  }
  function readBig(start, size) {
    var ch = chain(start), buf = new Uint8Array(ch.length * ssz), p = 0;
    for (var a = 0; a < ch.length; a++) { buf.set(u8.subarray(sectorOffset(ch[a]), sectorOffset(ch[a]) + ssz), p); p += ssz; }
    return size >= 0 ? buf.subarray(0, size) : buf;
  }

  // mini FAT
  var miniFat = new Uint32Array(0);
  if (nMiniFat > 0) {
    var mfb = readBig(miniFatStart, -1);
    miniFat = new Uint32Array(mfb.length / 4);
    var mdv = new DataView(mfb.buffer, mfb.byteOffset, mfb.byteLength);
    for (i = 0; i < miniFat.length; i++) miniFat[i] = mdv.getUint32(i * 4, true);
  }

  // directory
  var dirBuf = readBig(dirStart, -1);
  var ddv = new DataView(dirBuf.buffer, dirBuf.byteOffset, dirBuf.byteLength);
  var nEnt = Math.floor(dirBuf.length / 128);
  var raw = [];
  for (i = 0; i < nEnt; i++) {
    var b = i * 128;
    var nlen = ddv.getUint16(b + 64, true);
    var nm = '';
    for (j = 0; j + 1 < Math.max(0, nlen - 2); j += 2) nm += String.fromCharCode(ddv.getUint16(b + j, true));
    raw.push({
      name: nm, type: dirBuf[b + 66], color: dirBuf[b + 67],
      left: ddv.getInt32(b + 68, true), right: ddv.getInt32(b + 72, true), child: ddv.getInt32(b + 76, true),
      clsid: dirBuf.slice(b + 80, b + 96), state: ddv.getUint32(b + 96, true),
      ctime: dirBuf.slice(b + 100, b + 108), mtime: dirBuf.slice(b + 108, b + 116),
      start: ddv.getUint32(b + 116, true), size: ddv.getUint32(b + 120, true) + ddv.getUint32(b + 124, true) * 4294967296,
      children: [], data: null
    });
  }
  if (!raw.length) throw new Error('Empty OLE directory.');

  // mini stream lives in root entry
  var miniStream = raw[0].size > 0 ? readBig(raw[0].start, raw[0].size) : new Uint8Array(0);
  function readMini(start, size) {
    var out = new Uint8Array(size), p = 0, s = start, g = 0;
    while (s !== ENDOFCHAIN && s !== FREESECT && p < size && g++ < 1000000) {
      var take = Math.min(mssz, size - p);
      out.set(miniStream.subarray(s * mssz, s * mssz + take), p); p += take; s = miniFat[s];
    }
    return out;
  }

  for (i = 1; i < raw.length; i++) {
    var e = raw[i];
    if (e.type === 2) e.data = e.size === 0 ? new Uint8Array(0) : (e.size < miniCutoff ? readMini(e.start, e.size) : readBig(e.start, e.size));
  }

  // rebuild tree
  function attach(parent, id) {
    if (id < 0 || id >= raw.length || id === 0xFFFFFFFF | 0) return;
    var n = raw[id];
    if (!n || n.type === 0) return;
    attach(parent, n.left);
    parent.children.push(n);
    attach(parent, n.right);
    if (n.child >= 0 && n.child < raw.length) attach(n, n.child);
  }
  var rootNode = raw[0];
  if (rootNode.child >= 0 && rootNode.child < raw.length) attach(rootNode, rootNode.child);
  return rootNode;
}

function cfbFind(node, name) {
  for (var i = 0; i < node.children.length; i++) if (node.children[i].name === name) return node.children[i];
  return null;
}

/* ---------------- CFB WRITE ---------------- */
function nameOrder(a, b) {
  if (a.name.length !== b.name.length) return a.name.length - b.name.length;
  var A = a.name.toUpperCase(), B = b.name.toUpperCase();
  return A < B ? -1 : (A > B ? 1 : 0);
}

function cfbWrite(rootNode) {
  var ssz = 512, mssz = 64, miniCutoff = 4096;

  // Flatten into ordered entry list with tree links
  var entries = [];
  function assign(node, isRoot) {
    node._id = entries.length; entries.push(node);
    var ch = node.children.slice().sort(nameOrder);
    node._sorted = ch;
    for (var i = 0; i < ch.length; i++) assign(ch[i], false);
  }
  assign(rootNode, true);
  function buildTree(arr) { // returns id of subtree root
    if (!arr.length) return -1;
    var mid = arr.length >> 1;
    var n = arr[mid];
    n._left = buildTree(arr.slice(0, mid));
    n._right = buildTree(arr.slice(mid + 1));
    return n._id;
  }
  for (var i = 0; i < entries.length; i++) {
    var n = entries[i];
    n._left = -1; n._right = -1; n._child = -1;
  }
  (function walk(node) {
    node._child = buildTree(node._sorted);
    for (var a = 0; a < node._sorted.length; a++) walk(node._sorted[a]);
  })(rootNode);

  // Split streams
  var bigStreams = [], miniStreams = [];
  for (i = 1; i < entries.length; i++) {
    var e = entries[i];
    if (e.type !== 2) continue;
    var d = e.data || new Uint8Array(0);
    if (d.length === 0) { e._start = ENDOFCHAIN; e._size = 0; continue; }
    if (d.length < miniCutoff) miniStreams.push(e); else bigStreams.push(e);
  }

  // Build mini stream + miniFAT
  var miniTotal = 0;
  for (i = 0; i < miniStreams.length; i++) miniTotal += Math.ceil(miniStreams[i].data.length / mssz) * mssz;
  var miniBuf = new Uint8Array(miniTotal);
  var miniFatArr = [];
  var mpos = 0;
  for (i = 0; i < miniStreams.length; i++) {
    var e2 = miniStreams[i], nMini = Math.ceil(e2.data.length / mssz);
    var firstMini = mpos / mssz;
    miniBuf.set(e2.data, mpos); mpos += nMini * mssz;
    for (var q = 0; q < nMini; q++) miniFatArr.push(q === nMini - 1 ? ENDOFCHAIN : firstMini + q + 1);
    e2._start = firstMini; e2._size = e2.data.length;
  }
  var nMiniFatSec = Math.ceil((miniFatArr.length * 4) / ssz);

  // Directory sectors
  var nDirSec = Math.ceil((entries.length * 128) / ssz);

  // sector counts for streams
  var miniStreamSec = Math.ceil(miniBuf.length / ssz);
  var bigSec = 0;
  for (i = 0; i < bigStreams.length; i++) bigSec += Math.ceil(bigStreams[i].data.length / ssz);

  var dataSec = nDirSec + nMiniFatSec + miniStreamSec + bigSec;
  var nFat = 1;
  for (var iter = 0; iter < 40; iter++) {
    var total = nFat + dataSec;
    var need = Math.ceil((total * 4) / ssz);
    if (need === nFat) break;
    nFat = need;
  }
  if (nFat > 109) throw new Error('File too large for this writer (>7MB).');

  var totalSec = nFat + dataSec;
  var fat = new Uint32Array(nFat * (ssz / 4));
  for (i = 0; i < fat.length; i++) fat[i] = FREESECT;
  for (i = 0; i < nFat; i++) fat[i] = FATSECT;

  var cursor = nFat;
  function allocChain(count) {
    var start = cursor;
    for (var a = 0; a < count; a++) fat[cursor + a] = (a === count - 1) ? ENDOFCHAIN : (cursor + a + 1);
    cursor += count;
    return count ? start : ENDOFCHAIN;
  }
  var dirStart = allocChain(nDirSec);
  var miniFatStart = nMiniFatSec ? allocChain(nMiniFatSec) : ENDOFCHAIN;
  var miniStreamStart = miniStreamSec ? allocChain(miniStreamSec) : ENDOFCHAIN;
  for (i = 0; i < bigStreams.length; i++) {
    var be = bigStreams[i];
    be._start = allocChain(Math.ceil(be.data.length / ssz));
    be._size = be.data.length;
  }

  rootNode._start = miniStreamStart;
  rootNode._size = miniBuf.length;

  // Build output
  var out = new Uint8Array(ssz * (1 + totalSec));
  var dv = new DataView(out.buffer);
  var hdr = [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1];
  for (i = 0; i < 8; i++) out[i] = hdr[i];
  dv.setUint16(24, 0x003E, true);
  dv.setUint16(26, 0x0003, true);
  dv.setUint16(28, 0xFFFE, true);
  dv.setUint16(30, 9, true);
  dv.setUint16(32, 6, true);
  dv.setUint32(44, nFat, true);
  dv.setUint32(48, dirStart, true);
  dv.setUint32(56, miniCutoff, true);
  dv.setUint32(60, miniFatStart, true);
  dv.setUint32(64, nMiniFatSec, true);
  dv.setUint32(68, ENDOFCHAIN, true);
  dv.setUint32(72, 0, true);

var ROW0 = 7, NROWS = 30, SHEET = 0, DATE_R = 3, DATE_C = 2;
var K_PRESETS = 'fvinv.presets.v1', K_DRAFT = 'fvinv.draft.v3';

function b64ToBytes(b64){
  var bin = atob(b64), out = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
var toastT;
function toast(msg, bad){
  var el = document.getElementById('toast');
  el.textContent = msg; el.className = 'on' + (bad ? ' bad' : '');
  clearTimeout(toastT); toastT = setTimeout(function(){ el.className=''; }, bad ? 6000 : 2600);
}
function store(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

var template = b64ToBytes(EMBEDDED);
var $ = function(id){ return document.getElementById(id); };

/* ---------- grid ---------- */
var cells = [];
function buildGrid(){
  var host = $('grid'), frag = document.createDocumentFragment();
  for (var i=0;i<NROWS;i++){
    var row = document.createElement('div'); row.className='row';
    var ln = document.createElement('div'); ln.className='ln'; ln.textContent=(ROW0+i+1);
    row.appendChild(ln);
    var trio=[];
    for (var c=0;c<3;c++){
      var inp=document.createElement('input');
      inp.type='text'; inp.className='cell';
      inp.setAttribute('aria-label',['Pack','Size','Description'][c]+' row '+(ROW0+i+1));
      if(c===0){ inp.inputMode='decimal'; inp.placeholder='—'; }
      inp.dataset.r=i; inp.dataset.c=c;
      row.appendChild(inp); trio.push(inp);
    }
    cells.push(trio); frag.appendChild(row);
  }
  host.appendChild(frag);
  host.addEventListener('input', touched);
  host.addEventListener('keydown', onKey);
  host.addEventListener('paste', onPaste);
}
function onKey(e){
  var t=e.target; if(!t.classList||!t.classList.contains('cell')) return;
  var r=+t.dataset.r, c=+t.dataset.c, nr=null;
  if(e.key==='Enter'||e.key==='ArrowDown') nr=r+1;
  else if(e.key==='ArrowUp') nr=r-1; else return;
  if(nr<0||nr>=NROWS) return;
  e.preventDefault(); cells[nr][c].focus(); cells[nr][c].select();
}
function onPaste(e){
  var t=e.target; if(!t.classList||!t.classList.contains('cell')) return;
  var txt=(e.clipboardData||window.clipboardData).getData('text');
  if(!txt||(txt.indexOf('\n')<0&&txt.indexOf('\t')<0)) return;
  e.preventDefault();
  var r0=+t.dataset.r,c0=+t.dataset.c;
  var lines=txt.replace(/\r\n?/g,'\n').replace(/\n+$/,'').split('\n');
  for(var i=0;i<lines.length;i++){
    var r=r0+i; if(r>=NROWS) break;
    var parts=lines[i].split('\t');
    for(var j=0;j<parts.length;j++){ var c=c0+j; if(c>2) break; cells[r][c].value=parts[j].trim(); }
  }
  touched(); toast('Pasted '+Math.min(lines.length,NROWS-r0)+' rows.');
}
function readGrid(){
  var o=[]; for(var i=0;i<NROWS;i++) o.push([cells[i][0].value,cells[i][1].value,cells[i][2].value]);
  return o;
}
function writeGrid(rows){
  for(var i=0;i<NROWS;i++){
    var r=rows[i]||['','',''];
    for(var c=0;c<3;c++) cells[i][c].value=(r[c]==null?'':String(r[c]));
  }
  touched();
}

/* ---------- date gate ---------- */
function isoDate(){ return $('dueDate').value; }
function outputName(){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(isoDate());
  return m ? ('Joe Valadez Inventory '+m[2]+m[3]+m[1].slice(2)+'.xls') : null;
}
function refresh(){
  var n=0, rows=readGrid();
  for(var i=0;i<NROWS;i++) if(rows[i][0].trim()||rows[i][1].trim()||rows[i][2].trim()) n++;
  $('count').innerHTML='<b>'+n+'</b>/'+NROWS+' lines';
  var name=outputName(), el=$('outName');
  if(name){ el.textContent=name; el.className=''; }
  else { el.textContent='set a date first'; el.className='warn'; }
  $('btnBuild').disabled = !name;
  $('dueDate').className = name ? '' : 'need';
  $('dateReq').style.visibility = name ? 'hidden' : 'visible';
}
var draftT;
function touched(){
  refresh();
  clearTimeout(draftT);
  draftT=setTimeout(function(){
    store(K_DRAFT, JSON.stringify({ rows:readGrid(), note:$('noteText').value, date:isoDate() }));
  },400);
}

/* ---------- presets ---------- */
function getPresets(){ try{ return JSON.parse(load(K_PRESETS)||'{}')||{}; }catch(e){ return {}; } }
function putPresets(p){ store(K_PRESETS,JSON.stringify(p)); refreshPresets(); }
function refreshPresets(sel){
  var p=getPresets(), s=$('presetSel'), keep=sel||s.value;
  s.innerHTML='<option value="">— none —</option>';
  Object.keys(p).sort().forEach(function(k){
    var o=document.createElement('option'); o.value=k; o.textContent=k; s.appendChild(o);
  });
  if(keep&&p[keep]) s.value=keep;
}

/* ---------- dates ---------- */
function excelSerial(iso){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso); if(!m) return null;
  return Math.round((Date.UTC(+m[1],+m[2]-1,+m[3])-Date.UTC(1899,11,30))/86400000);
}
function serialToIso(n){
  if(typeof n!=='number'||!isFinite(n)||n<1) return '';
  var d=new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000);
  var p=function(x){ return (x<10?'0':'')+x; };
  return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate());
}

/* ---------- build ---------- */
function build(){
  var name=outputName();
  if(!name){ toast('Set the date in C4 first — the file name is built from it.', true); $('dueDate').focus(); return; }
  var rows=readGrid(), edits={}, i;
  for(i=0;i<NROWS;i++){
    var r=ROW0+i, pack=rows[i][0].trim(), size=rows[i][1].trim(), desc=rows[i][2].trim();
    if(pack===''){ edits[r+',0']={t:'b'}; }
    else {
      var num=Number(pack.replace(/,/g,''));
      edits[r+',0']=(isFinite(num)&&/^[-+]?[0-9.,]+$/.test(pack))?{t:'n',v:num}:{t:'s',v:pack};
    }
    edits[r+',1']= size===''?{t:'b'}:{t:'s',v:size};
    edits[r+',2']= desc===''?{t:'b'}:{t:'s',v:desc};
  }
  edits[DATE_R+','+DATE_C]={t:'n',v:excelSerial(isoDate())};
  var note=$('noteText').value.replace(/\s+$/,'');
  var out;
  try{ out=XLSLIB.buildXls(template,edits,SHEET,note); }
  catch(err){ toast('Build stopped: '+err.message,true); return; }
  var blob=new Blob([out],{type:'application/vnd.ms-excel'});
  var url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },4000);
  toast('Built '+name);
}

/* ---------- open a saved workbook ---------- */
function importWorkbook(bytes,label){
  var want=[DATE_R], i;
  for(i=0;i<NROWS;i++) want.push(ROW0+i);
  var g, note='';
  try{ g=XLSLIB.readSheetGrid(bytes,SHEET,want,[0,1,2]); }
  catch(e){ toast('Could not read that workbook: '+e.message,true); return; }
  try{ note=XLSLIB.readSheetNote(bytes,SHEET)||''; }catch(e){ note=''; }
  var rows=[];
  for(i=0;i<NROWS;i++){
    var r=ROW0+i;
    rows.push([g[r+',0']==null?'':g[r+',0'], g[r+',1']==null?'':g[r+',1'], g[r+',2']==null?'':g[r+',2']]);
  }
  writeGrid(rows);
  $('noteText').value=note;
  var iso=serialToIso(g[DATE_R+','+DATE_C]);
  if(iso) $('dueDate').value=iso;
  touched();
  toast('Loaded '+label+(note?' (with its note).':'.'));
}

/* ---------- wiring ---------- */
$('btnBuild').addEventListener('click', build);
$('dueDate').addEventListener('change', touched);
$('dueDate').addEventListener('input', touched);
$('noteText').addEventListener('input', touched);
$('btnOpen').addEventListener('click', function(){ $('xlsFile').click(); });
$('xlsFile').addEventListener('change', function(e){
  var f=e.target.files[0]; if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){ importWorkbook(new Uint8Array(fr.result), f.name); };
  fr.readAsArrayBuffer(f); e.target.value='';
});
$('btnLoad').addEventListener('click', function(){
  var k=$('presetSel').value;
  if(!k){ toast('Pick a saved list first.',true); return; }
  var p=getPresets(); if(!p[k]){ toast('That list is gone.',true); return; }
  writeGrid(p[k]); toast('Loaded "'+k+'".');
});
$('btnSave').addEventListener('click', function(){
  var cur=$('presetSel').value, name=prompt('Name this list:',cur||'');
  if(name==null) return;
  name=name.trim(); if(!name){ toast('Needs a name.',true); return; }
  var p=getPresets();
  if(p[name]&&!confirm('Replace the saved list "'+name+'"?')) return;
  p[name]=readGrid(); putPresets(p); refreshPresets(name); toast('Saved "'+name+'".');
});
$('btnDel').addEventListener('click', function(){
  var k=$('presetSel').value;
  if(!k){ toast('Pick a saved list first.',true); return; }
  if(!confirm('Delete the saved list "'+k+'"?')) return;
  var p=getPresets(); delete p[k]; putPresets(p); toast('Deleted "'+k+'".');
});
$('btnClear').addEventListener('click', function(){
  if(!confirm('Clear the 30 lines, the note, and the date?')) return;
  writeGrid([]); $('noteText').value=''; $('dueDate').value=''; touched(); toast('Cleared.');
});
$('btnRestore').addEventListener('click', function(){
  var d; try{ d=JSON.parse(load(K_DRAFT)); }catch(e){}
  if(!d){ toast('Nothing to restore.',true); return; }
  writeGrid(d.rows||[]); $('noteText').value=d.note||''; $('dueDate').value=d.date||'';
  touched(); this.hidden=true; toast('Restored your last session.');
});

/* ---------- lock screen ---------- */
/* Base64 only. It keeps the sheet out of casual sight; it is not encryption. */
var LOCK = 'NjYyMzk=';
var booted = false;
function boot(){
  if(booted) return; booted = true;
  buildGrid();
  refreshPresets();
  if(load(K_DRAFT)) $('btnRestore').hidden=false;
  refresh();
}
function tryUnlock(){
  var pw = $('pw').value, ok = false;
  try { ok = (pw === atob(LOCK)); } catch(e){ ok = false; }
  if(ok){
    $('gate').hidden = true;
    document.querySelector('.sheet').hidden = false;
    boot();
    var d = $('dueDate'); if(d) d.focus();
    return;
  }
  var card = $('gateCard');
  $('gateMsg').textContent = 'Wrong code.';
  $('pw').value = '';
  $('pw').focus();
  card.classList.remove('shake');
  void card.offsetWidth;
  card.classList.add('shake');
}
$('btnUnlock').addEventListener('click', tryUnlock);
$('pw').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); tryUnlock(); } });
$('pw').addEventListener('input', function(){ $('gateMsg').textContent=''; });
$('pw').focus();
})();
</script>
